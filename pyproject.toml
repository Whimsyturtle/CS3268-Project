[project]
name = "cs3268-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.2.0",
    "pandas>=3.0.6",
    "sae-lens==6.54.14",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
